<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌊 寻找避风港 - 云端实时同步版 🏖️</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --ocean-dark: #0077b6; --ocean-medium: #00b4d8; --ocean-light: #90e0ef; --sea-foam: #caf0f8; --card-bg: rgba(255, 255, 255, 0.94); --text-color: #023e8a; --huawei-red: #e60012; }
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, var(--sea-foam) 0%, var(--ocean-light) 100%); min-height: 100vh; margin: 0; padding: 20px; color: var(--text-color); }
        .container { max-width: 1420px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 20px 30px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0, 119, 182, 0.15); margin-bottom: 25px; border-bottom: 4px solid var(--ocean-medium); }
        .header-title h1 { margin: 0; font-size: 24px; color: var(--ocean-dark); }
        .header-title p { margin: 5px 0 0 0; color: #0077b6; font-size: 13px; }
        .export-pdf-btn { background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3); transition: all 0.2s; }
        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { flex: 1; min-width: 160px; padding: 12px; border: none; border-radius: 12px; background: rgba(255, 255, 255, 0.8); color: var(--ocean-dark); font-size: 15px; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        .tab-btn.active { background: var(--ocean-dark); color: white; box-shadow: 0 4px 12px rgba(0, 119, 182, 0.3); }
        .tab-btn.work-tab.active { background: var(--huawei-red); }
        .card { background: var(--card-bg); border-radius: 20px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.06); margin-bottom: 25px; }
        .card h2 { margin-top: 0; color: var(--ocean-dark); font-size: 18px; border-left: 4px solid var(--ocean-medium); padding-left: 10px; }
        .card-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card-header-flex h2 { margin: 0; }
        .sort-btn { background: var(--sea-foam); color: var(--ocean-dark); border: 2px solid var(--ocean-medium); padding: 6px 14px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 13px; transition: all 0.2s; }
        .sort-btn:hover { background: var(--ocean-medium); color: white; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full-width { grid-column: 1 / -1; }
        label { font-size: 13px; font-weight: bold; color: var(--ocean-dark); }
        input, select, textarea { padding: 10px 14px; border-radius: 10px; border: 2px solid var(--sea-foam); outline: none; font-size: 14px; background: #fff; }
        .submit-btn { background: linear-gradient(135deg, var(--ocean-medium), var(--ocean-dark)); color: white; border: none; padding: 14px 24px; font-size: 16px; font-weight: bold; border-radius: 12px; cursor: pointer; width: 100%; }
        .submit-btn.huawei-btn { background: linear-gradient(135deg, #ff4d4d, var(--huawei-red)); }
        #map { height: 380px; width: 100%; border-radius: 16px; margin-bottom: 20px; }
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; font-size: 13px; }
        th { background: var(--ocean-dark); color: white; padding: 12px 10px; text-align: left; white-space: nowrap; }
        td { padding: 10px; border-bottom: 1px solid #edf2f7; vertical-align: middle; }
        .thumb-img { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; cursor: pointer; }
        .no-photo { width: 50px; height: 50px; background: #f0f4f8; color: #999; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 11px; }
        .custom-pin { background: var(--ocean-dark); color: white; width: 28px; height: 28px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); display: flex; align-items: center; justify-content: center; border: 2px solid white; }
        .custom-pin span { transform: rotate(45deg); font-weight: bold; font-size: 13px; }
        .huawei-pin { background: #ffffff; border: 2px solid var(--huawei-red); width: 36px; height: 36px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); display: flex; align-items: center; justify-content: center; }
        .huawei-pin-inner { transform: rotate(45deg); display: flex; align-items: center; justify-content: center; }
        .tag { padding: 3px 7px; border-radius: 6px; font-size: 12px; font-weight: bold; display: inline-block; }
        .tag-yes { background: #e6fffa; color: #234e52; }
        .tag-no { background: #fff5f5; color: #742a2a; }
        .tag-partial { background: #fefcbf; color: #744210; }
        .distance-badge { background: #eef2ff; color: #4338ca; padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 12px; }
        .time-badge { background: #fff7ed; color: #c2410c; padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 12px; white-space: nowrap; border: 1px solid #ffedd5; }
        .action-btn { border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; margin-right: 4px; }
        .btn-edit { background: #e0f2fe; color: #0369a1; }
        .btn-delete { background: #ffe4e6; color: #be123c; }
        .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; }
        .modal img { max-width: 90%; max-height: 85%; border-radius: 12px; }
        @media print { .tab-menu, #add-section, #work-section, #map, .action-btn, .export-pdf-btn, .sort-btn { display: none !important; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-title">
            <h1>🌊 阳光避风港 · 租屋对比仪表盘 ☁️ (云端实时同步版)</h1>
            <p>手机 / 电脑 实时多端同步查看与更新</p>
        </div>
        <button class="export-pdf-btn" onclick="exportToPDF()">📄 导出对比表 (PDF)</button>
    </header>

    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab('view-section')">🗺️ 地图 & 房源对比列表</button>
        <button class="tab-btn" id="add-tab-btn" onclick="switchTab('add-section')">➕ 添加新屋子资料</button>
        <button class="tab-btn work-tab" onclick="switchTab('work-section')">❤️ 设置工作地点 (华为)</button>
    </div>

    <!-- TAB 1: VIEW -->
    <div id="view-section">
        <div class="card">
            <h2>🗺️ 房源与工作地点分布图</h2>
            <div id="map"></div>
        </div>
        <div class="card">
            <div class="card-header-flex">
                <h2>📊 房屋信息对比表</h2>
                <button class="sort-btn" id="sort-time-btn" onclick="toggleSortByViewingTime()">📅 按看房时间排序 (默认)</button>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>标记</th><th>照片</th><th>房屋名称</th><th>📅 预约看房时间</th><th>🚗 导航距离 / 时间</th><th>🚆 距离最近火车站</th><th>🚶 步行距离时间</th><th>月租 (SGD)</th><th>跟屋主同住?</th><th>住客情况</th><th>带访客?</th><th>基本设施有吗?</th><th>🔍 房间分析</th><th>包水电吗?</th><th>备注</th><th class="no-print">操作</th>
                        </tr>
                    </thead>
                    <tbody id="house-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- TAB 2: ADD / EDIT -->
    <div id="add-section" class="card" style="display: none;">
        <h2 id="form-title">📝 添加房屋信息</h2>
        <form id="house-form" onsubmit="handleHouseFormSubmit(event)">
            <input type="hidden" id="editingId" value="">
            <div class="form-grid">
                <div class="form-group full-width"><label>📍 Google Maps 链接或具体地址</label><input type="text" id="mapLink" required></div>
                <div class="form-group"><label>🏠 房屋名称</label><input type="text" id="houseName" required></div>
                <div class="form-group"><label>📅 预约看房时间 (几号, 几点)</label><input type="datetime-local" id="viewingTime"></div>
                <div class="form-group"><label>🚗 导航到办公室距离/时间</label><input type="text" id="customDistance"></div>
                <div class="form-group"><label>🚆 距离最靠近的火车站是：</label><input type="text" id="nearestStation" required></div>
                <div class="form-group"><label>🚶 距离最靠近的火车站步行距离：</label><input type="text" id="stationWalkDistance" required></div>
                <div class="form-group"><label>💵 月租 (SGD)</label><input type="number" id="price" required></div>
                <div class="form-group"><label>🔑 跟屋主同住？</label><select id="liveWithLandlord"><option value="No">No</option><option value="Yes">Yes</option></select></div>
                <div class="form-group">
                    <label>👨‍👩‍👧‍👦 住客情况</label>
                    <select id="housemateOption" onchange="toggleHousemateCountInput()"><option value="有">有</option><option value="没有">没有</option><option value="不知道">不知道</option></select>
                    <input type="number" id="housemateCount" placeholder="填几人？" style="margin-top: 4px;">
                </div>
                <div class="form-group"><label>👥 带访客？</label><select id="visitorPolicy"><option value="Yes">Yes</option><option value="久久一次">久久一次</option><option value="No">No</option></select></div>
                <div class="form-group"><label>🛋️ 基本设施有吗？</label><select id="amenitiesStatus"><option value="有 (Fully Furnished)">有 (Fully Furnished)</option><option value="Partial Furnished">Partial Furnished</option><option value="没有 (Unfurnished)">没有 (Unfurnished)</option></select></div>
                <div class="form-group"><label>💡 包水电吗？</label><select id="utilities"><option value="包水电网">包水电网</option><option value="包水不包电">包水不包电</option><option value="平分账单">平分账单</option><option value="完全不包">完全不包</option></select></div>
                <div class="form-group full-width"><label>🔍 房间分析</label><textarea id="roomAnalysis" rows="2"></textarea></div>
                <div class="form-group full-width"><label>📸 上传照片</label><input type="file" accept="image/*" onchange="previewImageFile(this)"><input type="hidden" id="photoBase64"><div id="photo-preview-box" style="margin-top: 8px; display: none;"><img id="photo-preview-img" src="" style="max-height: 120px;"></div></div>
                <div class="form-group full-width"><label>📝 备注</label><textarea id="notes" rows="2"></textarea></div>
            </div>
            <button type="submit" id="submit-btn" class="submit-btn">✨ 确认提交保存至云端</button>
            <button type="button" onclick="cancelEdit()" id="cancel-btn" style="display:none; margin-top:10px; background:#94a3b8;" class="submit-btn">取消编辑</button>
        </form>
    </div>

    <!-- TAB 3: WORK LOCATION -->
    <div id="work-section" class="card" style="display: none;">
        <h2 style="color: var(--huawei-red);">🏢 设置工作地点 (华为)</h2>
        <form id="work-form" onsubmit="handleWorkFormSubmit(event)">
            <div class="form-grid">
                <div class="form-group full-width"><label>📍 华为办公地点 Google Maps 链接或地址</label><input type="text" id="workMapLink" required></div>
                <div class="form-group full-width"><label>🏢 备注名称</label><input type="text" id="workName" value="华为办公室"></div>
            </div>
            <button type="submit" class="submit-btn huawei-btn">❤️ 保存工作地点至云端</button>
        </form>
        <div id="current-work-status" style="margin-top:20px; padding:12px; background:#fff0f0; border-radius:10px;">
            当前工作地点：<span id="work-status-text" style="font-weight:bold; color:var(--huawei-red);">未设置</span>
            <button onclick="clearWorkLocation()" id="clear-work-btn" style="display:none; margin-left:15px; color:red; border:none; background:none; cursor:pointer; text-decoration:underline;">清除工作地点</button>
        </div>
    </div>
</div>

<div id="imgModal" class="modal" onclick="closeModal()"><img id="modalImg" src=""></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // ⚙️ SUPABASE CONFIGURATION
    const SUPABASE_URL = 'https://apdvuzsnmrbrpsjdlkzy.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFwZHZ1enNubXJicnBzamRsa3p5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NTAxNTUsImV4cCI6MjEwNDUyNjE1NX0.V5bvUkJ0tMjKW2vw2fPJVb1SpuFcvdwG0gYe9uRwcc8';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let houses = [];
    let workLocation = null;
    let map = null;
    let markers = [];
    let sortAscending = true; // 排序方向控制 (默认升序)

    window.onload = async function() {
        initMap();
        toggleHousemateCountInput();
        await fetchCloudData();
    };

    function initMap() {
        map = L.map('map').setView([1.3521, 103.8198], 11);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
    }

    async function fetchCloudData() {
        const { data: houseData, error: houseErr } = await _supabase.from('houses').select('*').order('id', { ascending: true });
        if (houseErr) {
            console.error('Fetch Houses Error:', houseErr);
        } else if (houseData) {
            houses = houseData;
        }

        const { data: workData, error: workErr } = await _supabase.from('work_location').select('*').limit(1);
        if (workErr) {
            console.error('Fetch Work Location Error:', workErr);
        } else if (workData && workData.length > 0) {
            workLocation = workData[0];
        }

        render();
    }

    function toggleSortByViewingTime() {
        sortAscending = !sortAscending;
        const btn = document.getElementById('sort-time-btn');
        btn.innerText = sortAscending ? '📅 按看房时间排序 (由近到远 ⬆️)' : '📅 按看房时间排序 (由远到近 ⬇️)';
        render();
    }

    function exportToPDF() { switchTab('view-section'); setTimeout(() => { window.print(); }, 300); }

    function switchTab(tabId) {
        document.getElementById('view-section').style.display = tabId === 'view-section' ? 'block' : 'none';
        document.getElementById('add-section').style.display = tabId === 'add-section' ? 'block' : 'none';
        document.getElementById('work-section').style.display = tabId === 'work-section' ? 'block' : 'none';

        const btns = document.querySelectorAll('.tab-btn');
        btns[0].classList.toggle('active', tabId === 'view-section');
        btns[1].classList.toggle('active', tabId === 'add-section');
        btns[2].classList.toggle('active', tabId === 'work-section');

        if (tabId === 'view-section') setTimeout(() => { map.invalidateSize(); }, 200);
    }

    function toggleHousemateCountInput() {
        const option = document.getElementById('housemateOption').value;
        const countInput = document.getElementById('housemateCount');
        countInput.style.display = option === '有' ? 'block' : 'none';
        countInput.required = (option === '有');
        if (option !== '有') countInput.value = '';
    }

    function previewImageFile(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height, max_size = 600;
                    if (width > height) { if (width > max_size) { height *= max_size / width; width = max_size; } }
                    else { if (height > max_size) { width *= max_size / height; height = max_size; } }
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    const base64 = canvas.toDataURL('image/jpeg', 0.6);
                    document.getElementById('photoBase64').value = base64;
                    document.getElementById('photo-preview-img').src = base64;
                    document.getElementById('photo-preview-box').style.display = 'block';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function getLatLngFromInput(input) {
        const matchAt = input.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
        if (matchAt) return { lat: parseFloat(matchAt[1]), lng: parseFloat(matchAt[2]) };
        const matchQ = input.match(/q=(-?\d+\.\d+),(-?\d+\.\d+)/);
        if (matchQ) return { lat: parseFloat(matchQ[1]), lng: parseFloat(matchQ[2]) };

        try {
            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(input)}`);
            const data = await response.json();
            if (data && data.length > 0) return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
        } catch (e) {}
        return { lat: 1.3521 + (Math.random() - 0.5) * 0.05, lng: 103.8198 + (Math.random() - 0.5) * 0.05 };
    }

    function formatViewingTime(timeStr) {
        if (!timeStr) return '-';
        const d = new Date(timeStr);
        if (isNaN(d.getTime())) return timeStr;
        const month = (d.getMonth() + 1).toString().padStart(2, '0');
        const day = d.getDate().toString().padStart(2, '0');
        const hours = d.getHours().toString().padStart(2, '0');
        const minutes = d.getMinutes().toString().padStart(2, '0');
        return `${month}月${day}日 ${hours}:${minutes}`;
    }

    async function handleHouseFormSubmit(e) {
        e.preventDefault();
        const editingId = document.getElementById('editingId').value;
        const mapLink = document.getElementById('mapLink').value;
        const coords = await getLatLngFromInput(mapLink);

        const record = {
            mapLink, 
            houseName: document.getElementById('houseName').value,
            viewingTime: document.getElementById('viewingTime').value,
            customDistance: document.getElementById('customDistance').value,
            nearestStation: document.getElementById('nearestStation').value,
            stationWalkDistance: document.getElementById('stationWalkDistance').value,
            price: document.getElementById('price').value,
            liveWithLandlord: document.getElementById('liveWithLandlord').value,
            housemateOption: document.getElementById('housemateOption').value,
            housemateCount: document.getElementById('housemateCount').value ? parseInt(document.getElementById('housemateCount').value) : null,
            visitorPolicy: document.getElementById('visitorPolicy').value,
            amenitiesStatus: document.getElementById('amenitiesStatus').value,
            roomAnalysis: document.getElementById('roomAnalysis').value,
            utilities: document.getElementById('utilities').value,
            notes: document.getElementById('notes').value,
            lat: coords.lat, lng: coords.lng
        };

        const photoVal = document.getElementById('photoBase64').value;
        if (photoVal) record.photo = photoVal;

        let res;
        if (editingId) {
            res = await _supabase.from('houses').update(record).eq('id', editingId);
        } else {
            res = await _supabase.from('houses').insert([record]);
        }

        if (res.error) {
            alert('❌ 保存失败：' + res.error.message);
            console.error('Supabase Save Error:', res.error);
        } else {
            alert('✅ 房屋数据成功保存至 Supabase 云端！');
            resetForm();
            await fetchCloudData();
            switchTab('view-section');
        }
    }

    function editHouse(id) {
        const house = houses.find(h => h.id == id);
        if (!house) return;

        document.getElementById('editingId').value = house.id;
        document.getElementById('mapLink').value = house.mapLink;
        document.getElementById('houseName').value = house.houseName;
        document.getElementById('viewingTime').value = house.viewingTime || '';
        document.getElementById('customDistance').value = house.customDistance || '';
        document.getElementById('nearestStation').value = house.nearestStation || '';
        document.getElementById('stationWalkDistance').value = house.stationWalkDistance || '';
        document.getElementById('price').value = house.price;
        document.getElementById('liveWithLandlord').value = house.liveWithLandlord;
        document.getElementById('housemateOption').value = house.housemateOption || '有';
        toggleHousemateCountInput();
        document.getElementById('housemateCount').value = house.housemateCount || '';
        document.getElementById('visitorPolicy').value = house.visitorPolicy;
        document.getElementById('amenitiesStatus').value = house.amenitiesStatus || '有 (Fully Furnished)';
        document.getElementById('roomAnalysis').value = house.roomAnalysis || '';
        document.getElementById('utilities').value = house.utilities;
        document.getElementById('notes').value = house.notes || '';
        document.getElementById('photoBase64').value = house.photo || '';

        if (house.photo) {
            document.getElementById('photo-preview-img').src = house.photo;
            document.getElementById('photo-preview-box').style.display = 'block';
        } else {
            document.getElementById('photo-preview-box').style.display = 'none';
        }

        document.getElementById('form-title').innerText = '✏️ 修改房屋信息';
        document.getElementById('submit-btn').innerText = '💾 保存修改至云端';
        document.getElementById('cancel-btn').style.display = 'block';
        switchTab('add-section');
    }

    async function deleteHouse(id) {
        if (confirm('确定要删除这间屋子的资料吗？')) {
            const { error } = await _supabase.from('houses').delete().eq('id', id);
            if (error) alert('❌ 删除失败：' + error.message);
            await fetchCloudData();
        }
    }

    function resetForm() {
        document.getElementById('house-form').reset();
        document.getElementById('editingId').value = '';
        document.getElementById('photoBase64').value = '';
        document.getElementById('photo-preview-box').style.display = 'none';
        toggleHousemateCountInput();
        document.getElementById('form-title').innerText = '📝 添加房屋信息';
        document.getElementById('submit-btn').innerText = '✨ 确认提交保存至云端';
        document.getElementById('cancel-btn').style.display = 'none';
    }

    function cancelEdit() { resetForm(); switchTab('view-section'); }

    async function handleWorkFormSubmit(e) {
        e.preventDefault();
        const mapLink = document.getElementById('workMapLink').value;
        const name = document.getElementById('workName').value || '华为办公室';
        const coords = await getLatLngFromInput(mapLink);

        await _supabase.from('work_location').delete().neq('id', 0);
        const { error } = await _supabase.from('work_location').insert([{ name, mapLink, lat: coords.lat, lng: coords.lng }]);

        if (error) {
            alert('❌ 工作地点保存失败：' + error.message);
        } else {
            alert('✅ 工作地点已成功保存至云端！');
            await fetchCloudData();
            switchTab('view-section');
        }
    }

    async function clearWorkLocation() {
        if (confirm('确定要清除已设置的工作地点吗？')) {
            await _supabase.from('work_location').delete().neq('id', 0);
            workLocation = null;
            render();
        }
    }

    function render() {
        markers.forEach(m => map.removeLayer(m));
        markers = [];
        const bounds = [];

        if (workLocation) {
            const huaweiIcon = L.divIcon({
                className: '',
                html: `<div class="huawei-pin"><div class="huawei-pin-inner"><svg viewBox="0 0 24 24" width="22" height="22" fill="#E60012"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div></div>`,
                iconSize: [36, 36], iconAnchor: [18, 36]
            });
            const workMarker = L.marker([workLocation.lat, workLocation.lng], { icon: huaweiIcon }).addTo(map).bindPopup(`<b style="color:var(--huawei-red);">❤️ ${workLocation.name}</b>`);
            markers.push(workMarker);
            bounds.push([workLocation.lat, workLocation.lng]);
            document.getElementById('work-status-text').innerText = workLocation.name;
            document.getElementById('clear-work-btn').style.display = 'inline';
        } else {
            document.getElementById('work-status-text').innerText = '未设置';
            document.getElementById('clear-work-btn').style.display = 'none';
        }

        // 根据看房时间进行动态排序（未填看房时间的排在最底下）
        let sortedHouses = [...houses].sort((a, b) => {
            if (!a.viewingTime) return 1;
            if (!b.viewingTime) return -1;
            const timeA = new Date(a.viewingTime).getTime();
            const timeB = new Date(b.viewingTime).getTime();
            return sortAscending ? timeA - timeB : timeB - timeA;
        });

        const tableBody = document.getElementById('house-table-body');
        tableBody.innerHTML = '';

        sortedHouses.forEach((house, index) => {
            house.badge = String.fromCharCode(65 + index);
            let distText = house.customDistance || '-';
            let viewingTimeFormatted = formatViewingTime(house.viewingTime);
            let dirUrl = workLocation ? `https://www.google.com/maps/dir/?api=1&origin=${house.lat},${house.lng}&destination=${workLocation.lat},${workLocation.lng}&travelmode=driving` : house.mapLink;

            const customIcon = L.divIcon({
                className: '',
                html: `<div class="custom-pin"><span>${house.badge}</span></div>`,
                iconSize: [28, 28], iconAnchor: [14, 28]
            });

            const marker = L.marker([house.lat, house.lng], { icon: customIcon }).addTo(map)
                .bindPopup(`<b>${house.badge} - ${house.houseName}</b><br>📅 看房时间: ${viewingTimeFormatted}<br>租金: SGD ${house.price}<br><a href="${dirUrl}" target="_blank">📍 Google Maps 导航</a>`);
            markers.push(marker);
            bounds.push([house.lat, house.lng]);

            let housemateDisplayText = house.housemateOption === '有' ? (house.housemateCount ? `有 (${house.housemateCount}人)` : '有') : (house.housemateOption || '不知道');
            const photoHtml = house.photo ? `<img src="${house.photo}" class="thumb-img" onclick="openModal('${house.photo}')">` : `<div class="no-photo">无照片</div>`;

            const row = document.createElement('tr');
            row.innerHTML = `
                <td><b>${house.badge}</b></td>
                <td>${photoHtml}</td>
                <td><b>${house.houseName}</b></td>
                <td><span class="time-badge">📅 ${viewingTimeFormatted}</span></td>
                <td><span class="distance-badge">${distText}</span></td>
                <td>${house.nearestStation || '-'}</td>
                <td>${house.stationWalkDistance || '-'}</td>
                <td style="color:#2b9348; font-weight:bold;">SGD ${house.price}</td>
                <td><span class="tag ${house.liveWithLandlord === 'Yes' ? 'tag-no' : 'tag-yes'}">${house.liveWithLandlord}</span></td>
                <td><b>${housemateDisplayText}</b></td>
                <td><span class="tag ${house.visitorPolicy === 'Yes' ? 'tag-yes' : 'tag-no'}">${house.visitorPolicy}</span></td>
                <td><span class="tag tag-yes">${house.amenitiesStatus || ' Fully Furnished'}</span></td>
                <td>${house.roomAnalysis || '-'}</td>
                <td><span class="tag tag-yes">${house.utilities}</span></td>
                <td>${house.notes || '-'}</td>
                <td class="no-print">
                    <button onclick="editHouse(${house.id})" class="action-btn btn-edit">Edit</button>
                    <button onclick="deleteHouse(${house.id})" class="action-btn btn-delete">删除</button>
                </td>
            `;
            tableBody.appendChild(row);
        });

        if (sortedHouses.length === 0) tableBody.innerHTML = `<tr><td colspan="16" style="text-align:center; padding:25px;">暂无屋子记录</td></tr>`;
        if (bounds.length > 0) map.fitBounds(bounds, { padding: [60, 60] });
    }

    function openModal(src) { document.getElementById('modalImg').src = src; document.getElementById('imgModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('imgModal').style.display = 'none'; }
</script>
</body>
</html>
